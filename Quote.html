<section class="quote-hero">

<h1>Request a Free Quote</h1>

<p>
Tell us about your project and our team will prepare a personalized quotation for you.
</p>

</section>


<section class="quote-section">

<form action="https://formsubmit.co/cosmasvaati02@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="New Quote Request - Borabu Builders">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_next" value="http://127.0.0.1:5500/Thankyou.html">

<div class="row">

<div class="input-box">

<label>Full Name</label>

<input type="text" name="Full Name" required>

</div>

<div class="input-box">

<label>Email Address</label>

<input type="email" name="Email" required>

</div>

</div>



<div class="row">

<div class="input-box">

<label>Phone Number</label>

<input type="tel" name="Phone Number" required>

</div>

<div class="input-box">

<label>Project Location</label>

<input type="text" name="Project Location">

</div>

</div>


<div class="row">

<div class="input-box">

<label>Project Type</label>

<select name="Project Type">

<option>Residential House</option>

<option>Commercial Building</option>

<option>Renovation</option>

<option>Road Construction</option>

<option>Bridge Construction</option>

<option>Interior Finishing</option>

<option>Other</option>

</select>

</div>

<div class="input-box">

<label>Estimated Budget (KES)</label>

<input type="text" name="Budget">

</div>

</div>



<div class="input-box">

<label>Preferred Start Date</label>

<input type="date" name="Start Date">

</div>



<div class="input-box">

<label>Project Description</label>

<textarea
name="Description"
rows="7"
placeholder="Tell us more about your project..."
></textarea>

</div>


<button class="quote-btn">

Submit Quote Request

</button>

</form>

</section>
